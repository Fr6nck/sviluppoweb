<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foto dell'host</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf5ec;--raised:#fff;--line:#e2d7c4;--ink:#231b12;--muted:#6a5b48;--acc:#b4451f;--sea:#1c5a78;--pine:#1f6b3f;--ochre:#b07d0c}
*{box-sizing:border-box}body{margin:0;background:#e9e0cf;font-family:Onest,Arial,sans-serif;color:var(--ink);display:flex;gap:32px;justify-content:center;flex-wrap:wrap;padding:32px 16px}
figure{margin:0;display:flex;flex-direction:column;gap:12px;align-items:center}figcaption{font-size:14px;color:var(--muted);max-width:340px;text-align:center}
.phone{width:340px;max-width:100%;height:640px;background:var(--paper);border-radius:40px;border:10px solid #1d1710;padding:18px 16px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.top{display:flex;align-items:center;gap:8px;font-weight:600}.logo{width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px}
h1{font-family:Gloock,Georgia,serif;font-weight:400;font-size:32px;line-height:36px;margin:14px 0 22px}
.cover{height:170px;border-radius:22px;background:linear-gradient(135deg,#c9a77c,#8a6a45);position:relative}
.pill{position:absolute;left:12px;bottom:12px;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
.face{background:radial-gradient(circle at 50% 40%,#e8c6a6 0 26%,transparent 27%),radial-gradient(ellipse at 50% 105%,#6b4a33 0 48%,transparent 49%),#cdbb9f}
.tondo{position:absolute;top:-18px;right:-6px;width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.22);cursor:pointer}
.tondo::after{content:"";position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#2e9d5b;border:2px solid #fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.tiles span{border-radius:18px;color:#fff;padding:14px;min-height:76px;display:flex;align-items:flex-end;font-weight:500}
.velo{position:absolute;inset:0;background:rgba(23,19,13,.45)}
.foglio{position:absolute;left:0;right:0;bottom:0;background:var(--raised);border-radius:26px 26px 0 0;padding:14px 16px 20px}
.maniglia{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.chiudi{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px}
.intera{height:250px;border-radius:18px}
.foglio b{display:block;font-size:20px;margin:14px 0 6px}.foglio p{margin:0 0 16px;color:var(--muted);font-size:15px;line-height:22px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--acc);color:#fff8f2;border-radius:999px;padding:14px;font-weight:600;text-decoration:none}
</style></head><body>
<figure><div class="phone">
  <div class="top"><span class="logo">CC</span>Casa Checco</div>
  <h1>Benvenuti<br>a Casa Checco.</h1>
  <div class="cover"><span class="tondo face" role="button" aria-label="Chi ti accoglie: Francesco"></span><span class="pill">● Check-in dalle 15:00</span></div>
  <div class="tiles"><span style="background:var(--acc)">Check-in &amp; Check-out</span><span style="background:var(--sea)">Wi-Fi</span><span style="background:var(--pine)">Dove mangiare</span><span style="background:var(--ochre)">Parcheggio</span></div>
</div><figcaption>1 · Il tondo con la foto dell'host in alto a destra, sopra la copertina. Il logo resta al suo posto.</figcaption></figure>
<figure><div class="phone">
  <div class="top"><span class="logo">CC</span>Casa Checco</div>
  <h1>Benvenuti<br>a Casa Checco.</h1>
  <div class="cover"></div>
  <div class="velo"></div>
  <div class="foglio"><div class="maniglia"></div><span class="chiudi">✕</span>
    <div class="intera face" role="img" aria-label="Foto di Francesco"></div>
    <b>Ciao, sono Francesco</b>
    <p>Casa mia è casa vostra: per qualsiasi cosa, scrivimi.</p>
    <a class="btn" href="#">Scrivi a Francesco</a></div>
</div><figcaption>2 · Al tocco: la foto per intero, il benvenuto e il bottone per scrivere all'host.</figcaption></figure>
</body></html>
