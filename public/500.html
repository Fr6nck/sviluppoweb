  .occhiello {
    font-size: 10px; line-height: 16px; font-weight: 600; letter-spacing: 0.2em;

  a { color: #813131; }
</style>

<body>
  <main>
    <span class="occhiello">ARCO DEL VENTO · ASSISI</span>
